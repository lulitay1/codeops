<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habesha Recipes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Habesha Recipes</h1>

        <p>Browse and save your favorite Ethiopian recipes.</p>

        <label for="search">Search recipes</label>

        <input
            id="search"
            type="search"
            placeholder="Search recipes..."
        >

    </header>


    <main>

        <section>

            <h2>Recipes</h2>

            <div
                id="recipes"
                aria-label="Recipe list"
            ></div>

        </section>


        <aside>

            <h2>My Cookbook</h2>

            <div id="cookbook"></div>

        </aside>

    </main>


    <footer>

        <p>Habesha Recipes</p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
