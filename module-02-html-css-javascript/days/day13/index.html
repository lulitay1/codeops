<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ethiopian Habesha Eatery site for Ethiopian traditional foods and drinks">
    <title>Habesha Eatery</title>

<body>
    <header>
    <h1>Enjoy Ethiopian Cuisine at Habesha Eatery</h1>

    <nav><a href="index.html">Reservations</a> · <a href="contact.html">Contact</a></nav>
</header>
<main>
<h2>Reserve a Table</h2>
<form id="reservation" action="" method="post">
    <fieldset>
        <legend>Reservation Details</legend>
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" required>
        <label for="email">Email: </label>
        <input id="email" name= email type="email" required>
         <label for="tel">Tel: </label>
        <input id = "tel" name="tel" type="tel" required>
        <label for="date">Date: </label>
        <input id="date" name= "date" type="date" required>
        <label for="party_size">Party-size: </label>
        <input  type="number" id="party_size"name="party-size" min="1" max="20" required>
        <label for="requests">Special Requests</label>
        <textarea id="requests" name="requests" rows="4" ></textarea>
        <button type="submit">Reserve Table </button>
    </fieldset>
    </form>
<section id="menu-card">
<h2>Our Menu</h2>
<table id="menu">
    <caption>Habesha Eatery Menu</caption>
    <thead>
        <tr>
            <th scope="col">Food</th>
            <th scope="col">price</th>
            <th scope="col">ingredients</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Doro Wot</td>
            <td class="price">40</td>
            <td class="ingredient">Chicken, spices, water</td>
        </tr>
         <tr>
            <td>Tibs</td>
            <td class="price">30</td>
            <td class="ingredient">beef, spices</td>            
        </tr>
         <tr>
            <td>Kitfo</td>
            <td class="price">45</td>
            <td class="ingredient">ground beef, spices</td>
        </tr>
    </tbody>
</table>
</section>
<section id="location">
<h2>Find Us</h2>
