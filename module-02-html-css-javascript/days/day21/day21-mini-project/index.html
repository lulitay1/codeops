<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validated Signup Form</title>
</head>

<body>

    <main>

        <h1>Signup Form</h1>

        <p>Enter your information to sign up.</p>


        <form id="signup-form">

            <div>
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >
            </div>


            <div>
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="0912345678 or +251912345678"
                >
            </div>


            <!-- Dedicated error area -->
            <p id="error" role="alert"></p>


            <button type="submit">
                Sign Up
            </button>

        </form>


        <!-- Saved signup count -->
        <p>
            Total signups:
            <span id="signup-count">0</span>
        </p>

    </main>


    <script src="app.js"></script>

</body>
</html>
