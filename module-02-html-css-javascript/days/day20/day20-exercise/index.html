<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Async JavaScript Exercises</title>
</head>

<body>

    <main class="container">

        <h1>Async JavaScript Exercises</h1>

        <!-- ========================================= -->
        <!-- QUESTION 1 -->
        <!-- ========================================= -->

        <section>
            <h2>1. USD → ETB Exchange Rate</h2>

            <button id="rate-btn">
                Get USD → ETB Rate
            </button>

            <p id="rate-result">
                Click the button to fetch the rate.
            </p>
        </section>


        <!-- ========================================= -->
        <!-- QUESTION 2 -->
        <!-- ========================================= -->

        <section>
            <h2>2. Fetch → JSON → Render</h2>

            <button id="post-btn">
                Fetch Post
            </button>

            <div id="post-result">
                No post loaded yet.
            </div>
        </section>


        <!-- ========================================= -->
        <!-- QUESTION 3 -->
        <!-- ========================================= -->

        <section>
            <h2>3. Network Error vs HTTP Error</h2>

            <button id="network-error-btn">
                Test Wrong URL
            </button>

            <button id="http-error-btn">
                Test 404 URL
            </button>

            <p id="error-result">
                No test has been run.
            </p>
        </section>


        <!-- ========================================= -->
        <!-- QUESTION 4 -->
        <!-- ========================================= -->

        <section>
            <h2>4. Promise.all()</h2>

            <button id="parallel-btn">
                Fetch First Two Posts
            </button>

            <div id="parallel-result">
                No data loaded yet.
            </div>
        </section>


        <!-- ========================================= -->
        <!-- QUESTION 5 -->
        <!-- ========================================= -->

        <section>
            <h2>5. Loading / Success / Error States</h2>

            <button id="load-btn">
                Load Data
            </button>

            <p id="status">
                Click "Load Data".
            </p>

            <div id="data-result"></div>
        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
