<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ethiopian Habesha Eatery site for Ethiopian traditional foods and drinks">
    <title>Habesha Eatery mini-site</title>
</head>
<body>
<header>
    <h1>Enjoy Ethiopian Cuisine at Habesha Eatery</h1>
    <nav><a href="index.html">Reserve</a> · <a href="contact.html">Contact us</a></nav>
</header>

<main>
<h2>Reserve a Table</h2>
<form id="reservation" action="" method="post">
    <fieldset>
        <legend>Reservation Details</legend>
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" required> <br>
        <label for="email">Email: </label>
        <input id="email" name= email type="email" required> <br>
        <label for="tel">Tel: </label>
        <input id = "tel" name="tel" type="tel" required> <br>
        <label for="date">Date: </label>
        <input id="date" name= "date" type="date" required> <br>
        <label for="party_size">Party-size: </label>
        <input  type="number" id="party_size"name="party-size" min="1" max="20" required> <br>
        <label for="requests">Special Requests</label>
        <textarea id="requests" name="requests" rows="4" ></textarea> <br>
        <button type="submit">Reserve Table </button>
    </fieldset>
    </form>
<h2>Our Menu</h2>
<table id="menu">
    <caption>Habesha Eatery Menu</caption>
    <thead>
        <tr>
            <th scope="col">Food</th>
            <th scope="col">price</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Doro Wot</td>
            <td>40 ETB</td>
        </tr>
         <tr>
            <td>Tibs</td>
            <td>30 ETB</td>
        </tr>
         <tr>
            <td>Kitfo</td>
            <td>45 ETB</td>
        </tr>
    </tbody>
</table>

<section id="location">
    <h2>Find Us</h2>
    <img 
        src="image.png" width="300" height="300" alt="Ethiopian Doro Wot, traditional chicken stew">
    <iframe 
        src= "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d126088.08887514078!2d38.7121152!3d9.0406912!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2set!4v1785452237434!5m2!1sen!2set"
        width="300" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
        title="Map showing the location of Habesha Eatery" frameborder="0"></iframe>
</section>
</main>
<footer>Habesha Eatery &copy All Rights Reserved</footer>
