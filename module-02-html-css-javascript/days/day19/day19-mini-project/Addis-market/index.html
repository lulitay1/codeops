<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Market Shopping List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Addis Market</h1>
            <p>Shopping List</p>
        </header>


        <!-- Add Item Form -->
        <section class="form-section">

            <h2>Add an Item</h2>

            <form id="add-form">

                <div class="form-group">
                    <label for="name">Item Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Coffee"
                    >
                </div>


                <div class="form-group">
                    <label for="price">Price (ETB)</label>

                    <input
                        type="number"
                        id="price"
                        placeholder="e.g. 250"
                        min="0"
                        step="0.01"
                    >
                </div>


                <button type="submit">
                    Add Item
                </button>

            </form>

        </section>


        <!-- Shopping List -->
        <section class="list-section">

            <h2>My Shopping List</h2>

            <ul id="list"></ul>

            <p id="empty-message">
                No items added yet.
            </p>

        </section>


        <!-- Total -->
        <section class="total-section">

            <h2>Total</h2>

            <p>
                <span id="total">0.00</span> ETB
            </p>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
