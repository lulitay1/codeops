<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Exercises</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>DOM Exercises</h1>

    <!-- Question 1 -->
    <section>
        <h2>1. Select and Change an Element</h2>

        <p id="message">This is the original text.</p>

        <button id="changeBtn">Change Text</button>
    </section>


    <!-- Question 2 -->
    <section>
        <h2>2. Create List Items Dynamically</h2>

        <ul id="cityList"></ul>
    </section>


    <!-- Question 3 -->
    <section>
        <h2>3. Event Bubbling</h2>

        <div id="buttonContainer">

            <button id="clickBtn">
                Click Me
            </button>

        </div>
    </section>


    <!-- Question 4 -->
    <section>
        <h2>4. Event Delegation and Delete</h2>

        <ul id="itemList">

            <li class="item">
                Coffee
                <button class="delete-btn">Delete</button>
            </li>

            <li class="item">
                Tea
                <button class="delete-btn">Delete</button>
            </li>

            <li class="item">
                Bread
                <button class="delete-btn">Delete</button>
            </li>

        </ul>
    </section>


    <!-- Question 5 -->
    <section>
        <h2>5. Form Handling</h2>

        <form id="nameForm">

            <input
                type="text"
                id="nameInput"
                placeholder="Enter a name"
            >

            <button type="submit">
                Add
            </button>

        </form>

        <ul id="nameList"></ul>
    </section>


    <script src="script.js"></script>

</body>
</html>
