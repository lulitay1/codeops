name: Deploy React Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: module-03-react-nextjs/projects/react-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: module-03-react-nextjs/projects/react-portfolio
        run: npm ci

      - name: Build
        working-directory: module-03-react-nextjs/projects/react-portfolio
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: module-03-react-nextjs/projects/react-portfolio/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4